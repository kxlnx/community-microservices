server:
  port: 8000
  forward-headers-strategy: framework

spring:
  cloud:
    gateway:
      x-forwarded:
        enabled: true
        host-enabled: true
        port-enabled: true
      routes:
        - id: user-service
          uri: ${GATEWAY_USER_URI:http://localhost:8086}
          predicates:
            - Path=/login,/register,/logout,/kaptcha,/forget,/activation/**,/user/**,/follow,/unfollow,/followees/**,/followers/**
        - id: post-service
          uri: ${GATEWAY_POST_URI:http://localhost:8087}
          predicates:
            - Path=/discuss/**,/index,/
        - id: interact-service
          uri: ${GATEWAY_INTERACT_URI:http://localhost:8083}
          predicates:
            - Path=/comment/**,/like
        - id: message-service
          uri: ${GATEWAY_MESSAGE_URI:http://localhost:8084}
          predicates:
            - Path=/letter/**,/notice/**
        - id: search-page
          uri: ${GATEWAY_POST_URI:http://localhost:8087}
          predicates:
            - Path=/search
        - id: static
          uri: ${GATEWAY_POST_URI:http://localhost:8087}
          predicates:
            - Path=/css/**,/js/**,/img/**,/fonts/**
        - id: fallback
          uri: ${GATEWAY_POST_URI:http://localhost:8087}
          predicates:
            - Path=/**

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.nowcoder: debug
    org.springframework.cloud.gateway: info

gateway:
  jwt:
    secret: ${JWT_SECRET:community-microservice-secret-key-2024}
    expiration: 43200000
    whitelist: /login,/register,/kaptcha,/activation,/search,/index,/discuss,/css,/js,/img,/fonts
