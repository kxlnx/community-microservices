server:
  port: 8087
  forward-headers-strategy: framework

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: true
  thymeleaf:
    cache: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/community_post?characterEncoding=utf-8&useSSL=false&serverTimezone=Hongkong&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 600000
      connection-test-query: SELECT 1
  data:
    redis:
      database: 11
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  task:
    execution:
      pool:
        core-size: 5
        max-size: 15
        queue-capacity: 100
    scheduling:
      pool:
        size: 5
  quartz:
    job-store-type: jdbc
    scheduler-name: communityScheduler
    properties:
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.threadPool.threadCount: 5

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.nowcoder.community.entity
  configuration:
    use-generated-keys: true
    map-underscore-to-camel-case: true

caffeine:
  posts:
    max-size: 15
    expire-seconds: 180

wk:
  image:
    command: f:/work/wkhtmltopdf/bin/wkhtmltoimage
    storage: f:/work/wk-images

community:
  path:
    domain: http://localhost:8087
    upload: f:/work/data/upload

feign:
  client:
    interact:
      url: ${INTERACT_SERVICE_URL:http://localhost:8083}
    search:
      url: ${SEARCH_SERVICE_URL:http://localhost:8085}
