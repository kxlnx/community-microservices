<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="icon" href="https://static.nowcoder.com/images/logo_87_87.png"/>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" crossorigin="anonymous">
	<link rel="stylesheet" th:href="@{/css/global.css}" />
	<title>牛客网-我的帖子</title>
</head>
<body>
	<div class="nk-container">
		<!-- 头部 -->
		<header class="bg-dark sticky-top" th:replace="index::header"></header>

		<!-- 内容 -->
		<div class="main">
			<div class="container">
				<!-- 选项 -->
				<div class="position-relative">
					<ul class="nav nav-tabs">
						<li class="nav-item">
							<a class="nav-link" th:href="@{/user/profile/{id}(id=${user.id})}">个人信息</a>
						</li>
						<li class="nav-item">
							<a class="nav-link active" th:href="@{/user/my-post}">我的帖子</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" th:href="@{/user/my-reply}">我的回复</a>
						</li>
					</ul>
					<a th:href="@{/user/profile/{id}(id=${user.id})}" class="text-muted position-absolute rt-0">返回个人主页&gt;</a>
				</div>
				<!-- 我的帖子 -->
				<div class="mt-4">
					<h6><b class="square"></b> 发布的帖子(<span th:text="${postCount}">0</span>)</h6>
					<div th:if="${postCount == 0}" class="text-muted text-center mt-5">
						还没有发布过帖子，去<a th:href="@{/index}">首页</a>发一个吧！
					</div>
					<ul class="list-unstyled mt-4" th:if="${postCount > 0}">
						<li class="media pb-3 pt-3 mb-3 border-bottom" th:each="post:${posts}">
							<div class="media-body">
								<h6>
									<a th:href="@{/discuss/detail/{id}(id=${post.id})}" th:text="${post.title}">帖子标题</a>
									<span class="badge badge-success ml-2" th:if="${post.type == 1}">置顶</span>
									<span class="badge badge-danger ml-1" th:if="${post.status == 1}">精华</span>
								</h6>
								<div class="text-muted mt-2">
									<span th:text="${#dates.format(post.createTime, 'yyyy-MM-dd HH:mm')}">2025-01-01 12:00</span>
									<span class="ml-3" th:text="${post.commentCount} + ' 评论'">0 评论</span>
								</div>
							</div>
						</li>
					</ul>
				</div>
			</div>
		</div>

		<!-- 尾部 -->
		<footer class="bg-dark">
			<div class="container">
				<div class="row">
					<div class="col-4 qrcode">
						<img src="https://uploadfiles.nowcoder.com/app/app_download.png" class="img-thumbnail" style="width:136px;" />
					</div>
					<div class="col-8 detail-info">
						<div class="row">
							<div class="col">
								<ul class="nav">
									<li class="nav-item"><a class="nav-link text-light" href="#">关于我们</a></li>
									<li class="nav-item"><a class="nav-link text-light" href="#">加入我们</a></li>
									<li class="nav-item"><a class="nav-link text-light" href="#">意见反馈</a></li>
									<li class="nav-item"><a class="nav-link text-light" href="#">企业服务</a></li>
									<li class="nav-item"><a class="nav-link text-light" href="#">联系我们</a></li>
									<li class="nav-item"><a class="nav-link text-light" href="#">免责声明</a></li>
									<li class="nav-item"><a class="nav-link text-light" href="#">友情链接</a></li>
								</ul>
							</div>
						</div>
						<div class="row">
							<div class="col">
								<ul class="nav btn-group-vertical company-info">
									<li class="nav-item text-white-50">公司地址：北京市朝阳区大屯路东金泉时代3-2708北京牛客科技有限公司</li>
									<li class="nav-item text-white-50">联系方式：010-60728802(电话)&nbsp;&nbsp;&nbsp;&nbsp;admin@nowcoder.com</li>
									<li class="nav-item text-white-50">牛客科技©2018 All rights reserved</li>
								</ul>
							</div>
						</div>
					</div>
				</div>
			</div>
		</footer>
	</div>

	<script src="https://code.jquery.com/jquery-3.3.1.min.js" crossorigin="anonymous"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" crossorigin="anonymous"></script>
	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" crossorigin="anonymous"></script>
	<script th:src="@{/js/global.js}"></script>
</body>
</html>
